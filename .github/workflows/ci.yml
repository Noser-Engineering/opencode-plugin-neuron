name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  # The compliance layer assumes the config hook runs before OpenCode resolves
  # providers. Only a real OpenCode can confirm that, so this runs separately
  # and against whatever version is current.
  verify-protection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install OpenCode
        run: npm install --global opencode-ai
      - run: ./scripts/verify-protection.sh
